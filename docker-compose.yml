services:
  db:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: factura
      POSTGRES_PASSWORD: factura
      POSTGRES_DB: factura
    ports:
      - "5433:5432"
    volumes:
      # Postgres 18+ images mount the whole dir (data lives in a version subdir).
      - factura_pgdata:/var/lib/postgresql

  # S3-compatible object storage for the original PDFs (local dev only).
  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: factura
      MINIO_ROOT_PASSWORD: facturasecret
    ports:
      - "9000:9000" # S3 API
      - "9001:9001" # web console
    volumes:
      - factura_minio:/data

  # One-shot: create the buckets on startup so uploads have somewhere to land.
  #
  # Two of them, and never one bucket with two prefixes: `factura` holds private
  # bill PDFs and is readable only through signed URLs, while `factura-media`
  # holds public CMS images and is anonymously readable — the Next.js image
  # optimizer fetches remote sources without forwarding credentials, so its
  # source has to be public. Mixing them would make one of those two facts
  # wrong.
  minio-init:
    image: minio/mc:latest
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      until mc alias set local http://minio:9000 factura facturasecret; do sleep 1; done;
      mc mb --ignore-existing local/factura;
      mc mb --ignore-existing local/factura-media;
      mc anonymous set download local/factura-media;
      "

volumes:
  factura_pgdata:
  factura_minio:
